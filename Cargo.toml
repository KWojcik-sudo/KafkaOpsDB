[workspace]
resolver = "3"
members = ["crates/model", "crates/table", "crates/ingest", "crates/query", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/KWojcik-sudo/KafkaOpsDB"

[workspace.dependencies]
model = { path = "crates/model" }
table = { path = "crates/table" }
ingest = { path = "crates/ingest" }
query = { path = "crates/query" }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
toml = "0.9"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
datafusion = { version = "55.2", default-features = false, features = ["nested_expressions", "datetime_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "sql"] }
futures = "0.3"
object_store = { version = "0.13", features = ["aws", "azure", "gcp", "http"] }
rand = "0.9"
rdkafka = { version = "0.39", default-features = false, features = ["libz", "ssl", "zstd"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
bytes = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs"] }
arrow = { version = "59.2", default-features = false, features = ["prettyprint"] }
arrow-avro = { version = "59.2", default-features = false, features = ["snappy"] }
parquet = { version = "59.2", default-features = false, features = ["arrow", "async", "object_store", "snap", "zstd"] }
proptest = "1"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
