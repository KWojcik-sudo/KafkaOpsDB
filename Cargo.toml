[workspace]
resolver = "3"
members = ["crates/kseg", "crates/table"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/KWojcik-sudo/KafkaOpsDB"

[workspace.dependencies]
kseg = { path = "crates/kseg" }
table = { path = "crates/table" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
object_store = { version = "0.13", features = ["aws", "azure", "gcp", "http"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
url = "2"
bytes = "1"
crc32c = "0.6"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
zstd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs"] }
arrow = "59.2"
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }
proptest = "1"
tempfile = "3"

[profile.release]
debug = 1
